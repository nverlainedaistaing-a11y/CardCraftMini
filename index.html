<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Verlaine Ntengang's digital business card.">
  <title>V.D.N.| Digital Business Card</title>

  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="business-card">
    <!-- Task 2: Profile photo -->
    <div class="photo-frame">
        <img class="profile-photo" src="images/profil.jpg" alt="Verlaine Ntengang">
    </div>
    <!-- Task 3: Name, job title and bio -->
     <h1 class="card-name">Verlaine Ntengang</h1>
     <p class="card-title">Web & Software Developer</p>

     <p class="bio">
        I build modern websites and business applications
        that simplify processes and enhance user experiences.
     </p> 

    <div class="services">
        <span>Web Development</span>
        <span>Business Applications</span>
        <span>Technical Support</span>
        <span>Responsive Design</span>
    </div>
    <!-- Task 4: Contact button and icon links -->
  </main>
</body>
</html>
